# Выкладка сайта на хостинг REG.RU после каждого изменения в ветке main.
# Включается переменной репозитория DEPLOY_ENABLED = true (Settings → Secrets and variables → Actions → Variables).
# Доступ к хостингу хранится в секретах репозитория (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER   — адрес FTP-сервера из панели REG.RU
#   FTP_USERNAME — логин FTP
#   FTP_PASSWORD — пароль FTP
#   FTP_DIR      — папка сайта на сервере, с «/» на конце, например www/te-power.ru/
# Протокол — переменная FTP_PROTOCOL (ftps по умолчанию; ftp, если хостинг не поддерживает шифрование).
# На хостинг уходят только файлы сайта: служебные папки (tools, .github) и описания (*.md) не выкладываются.
# Выкладка загружает новые и изменённые файлы и удаляет с сервера то, что удалили из репозитория;
# чужие файлы на сервере (например, старый WordPress) она не трогает.
name: Выкладка на REG.RU

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# Выкладке нужно только чтение репозитория
permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Версии закреплены по коммиту: чужой код, получающий пароль FTP, не может подмениться незаметно
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Загрузка файлов на хостинг
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65  # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            **/*.md
            .nojekyll
